[versions]
androidGradlePlugin = "8.1.1"
kotlin = "1.8.21"
firebaseBom = "32.2.0"
material = "1.9.0"
recyclerView = "1.3.0"
constraintLayout = "2.1.4"
firebaseDatabase = "20.2.2"
firebaseCore = "21.1.1"
googleGmsServices = "4.3.15"
navigation = "2.7.7"

[libraries]
androidGradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "androidGradlePlugin" }
kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
material = { module = "com.google.android.material:material", version.ref = "material" }
recyclerView = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerView" }
constraintLayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintLayout" }
firebaseBom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebaseDatabase = { module = "com.google.firebase:firebase-database-ktx", version.ref = "firebaseDatabase" }
firebaseCore = { module = "com.google.firebase:firebase-core-ktx", version.ref = "firebaseCore" }
googleGmsServices = { module = "com.google.gms:google-services", version.ref = "googleGmsServices" }
navigationFragmentKtx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
navigationUiKtx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }


[bundles]
firebase = ["firebaseBom", "firebaseDatabase", "firebaseCore"]

